title = "Gitleaks Configuration - Admin Panel Security"

# Extend the default rules to include Web3-specific secrets
[extend]
useDefault = true

# Custom rules for admin-specific secrets
[[rules]]
description = "Admin API Key"
id = "admin-api-key"
regex = '''(?i)(admin)[_-]?api[_-]?key[=:]\s*([a-zA-Z0-9_-]{32,})'''
keywords = ["admin", "api", "key"]

[[rules]]
description = "Admin Secret"
id = "admin-secret"
regex = '''(?i)(admin)[_-]?secret[=:]\s*([a-zA-Z0-9_-]{32,})'''
keywords = ["admin", "secret"]

[[rules]]
description = "Admin Password"
id = "admin-password"
regex = '''(?i)(admin)[_-]?password[=:]\s*([a-zA-Z0-9_-]{8,})'''
keywords = ["admin", "password"]

[[rules]]
description = "Ethereum Private Key"
id = "ethereum-private-key"
regex = '''(?i)(ethereum|eth)[_-]?private[_-]?key[=:]\s*([0-9a-fA-F]{64})'''
keywords = ["ethereum", "private", "key", "eth"]

[[rules]]
description = "Solana Private Key"
id = "solana-private-key"
regex = '''(?i)(solana)[_-]?private[_-]?key[=:]\s*([1-9A-HJ-NP-Za-km-z]{88})'''
keywords = ["solana", "private", "key"]

[[rules]]
description = "Mnemonic Phrase"
id = "mnemonic-phrase"
regex = '''(?i)(mnemonic|seed|phrase)[=:]\s*([a-zA-Z ]{15,})'''
keywords = ["mnemonic", "seed", "phrase"]

[[rules]]
description = "Infura Project ID"
id = "infura-project-id"
regex = '''(?i)(infura)[_-]?project[_-]?id[=:]\s*([a-f0-9]{32})'''
keywords = ["infura", "project", "id"]

[[rules]]
description = "Alchemy API Key"
id = "alchemy-api-key"
regex = '''(?i)(alchemy)[_-]?api[_-]?key[=:]\s*([a-zA-Z0-9_-]{32,})'''
keywords = ["alchemy", "api", "key"]

[[rules]]
description = "Phantom Wallet API Key"
id = "phantom-api-key"
regex = '''(?i)(phantom)[_-]?api[_-]?key[=:]\s*([a-zA-Z0-9_-]{32,})'''
keywords = ["phantom", "api", "key"]

[[rules]]
description = "Solana RPC URL with Key"
id = "solana-rpc-url"
regex = '''(?i)(https?://[^/]+\.(solana\.com|helius\.rpc\.pool|triton\.one)/[^/]+[a-zA-Z0-9_-]{20,})'''
keywords = ["solana.com", "helius.rpc.pool", "triton.one"]

[[rules]]
description = "Web3 Secret Key"
id = "web3-secret-key"
regex = '''(?i)(web3|blockchain|crypto)[_-]?secret[_-]?key[=:]\s*([a-zA-Z0-9+/]{32,})'''
keywords = ["web3", "blockchain", "crypto", "secret", "key"]

[[rules]]
description = "JWT Secret"
id = "jwt-secret"
regex = '''(?i)(jwt)[_-]?secret[=:]\s*([a-zA-Z0-9_-]{32,})'''
keywords = ["jwt", "secret"]

[[rules]]
description = "Encryption Key"
id = "encryption-key"
regex = '''(?i)(encryption)[_-]?key[=:]\s*([a-zA-Z0-9_-]{32,})'''
keywords = ["encryption", "key"]

# Global allowlist.
#
# gitleaks' schema: `paths`, `regexes` and `commits` are plain string arrays on
# one [allowlist] table. Repeating [allowlist.commits] as a table is a TOML
# error ("table commits already exists") and stops gitleaks before it scans a
# single commit. Allowlisting commits by *message* is not a gitleaks feature
# either, and would have exempted any commit that mentioned "test" or "docs".
#
# Every path is anchored to a directory boundary or the end of the name. The
# old unanchored words matched far more than intended: `build` matched
# src/lib/authority/build-tx.ts, `temp` matched .env.production.template, and
# `\.git` matched .github/. Real env files (.env.local, .env.staging, ...) are
# deliberately NOT allowlisted: they are exactly what a secret scan is for.
[allowlist]
description = "Global Allowlist"
paths = [
    '''(^|/)node_modules/''',
    '''(^|/)\.next/''',
    '''(^|/)(dist|coverage|\.cache)/''',
    '''(^|/)pnpm-lock\.yaml$''',
    '''(^|/)package-lock\.json$''',
    '''(^|/)yarn\.lock$''',
    '''(^|/)\.env(\.[a-z]+)?\.(example|sample|template)$''',
]
# Matched against the extracted secret, not the whole line.
regexes = [
    # Placeholder values: example_key, your-secret-here, ${API_KEY}
    '''(?i)(example|mock|sample|fake|dummy|placeholder)[_-]?(key|secret|token|password|private|seed|mnemonic)''',
    '''(?i)your[_-]?(key|secret|token|password|private|seed|mnemonic)[_-]?here''',
    '''^\$\{[A-Z_]+\}$''',
]
