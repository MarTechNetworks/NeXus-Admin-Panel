name: Deploy Web3 Admin

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
        - testnet

env:
  REGISTRY: ghcr.io
  # Matches the Frontend/Backend convention (ghcr.io/martechnetworks/nexus-*).
  # `github.repository` would have published the admin under the bare repo name
  # and collided with the other two apps in this monorepo.
  IMAGE_NAME: martechnetworks/nexus-admin

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Scan the source tree, not `:latest` — on a first run (or any run before
      # the build job has pushed) that image tag does not exist yet and the scan
      # failed the whole pipeline for a reason unrelated to this commit.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  web3-security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      # This is a pnpm project (pnpm-lock.yaml, no package-lock.json). `npm audit`
      # dies with ENOLOCK here and took the whole pipeline down with it, since the
      # build job `needs` this one.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Web3 Dependency Check
        run: |
          pnpm audit --audit-level moderate
          pnpm why @tanstack/react-query

  test:
    needs: [security-scan, web3-security-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      # This is a pnpm project (pnpm-lock.yaml, no package-lock.json), so `npm ci`
      # failed outright. Node 22 is required by pnpm 11.
      - uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run linting
        run: pnpm run lint
      - name: Build
        run: pnpm run build

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    # Queue deploys, never cancel them. A cancel lands mid-script, after nginx is
    # repointed but before the old container is retired, or worse. Note this
    # group is per-repository -- the flock in deploy-zero-downtime.sh is what
    # serialises this against the frontend and backend pipelines, which deploy to
    # the same box and share its disk.
    concurrency:
      group: deployment
      cancel-in-progress: false
    strategy:
      matrix:
        environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v3
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ matrix.environment }}
            # The tag the deploy actually pulls, and the reason it is a full,
            # IMMUTABLE sha rather than the mutable `:staging` above. The keep-N
            # image reclaim on the host retains the previous tag as a rollback
            # target; a mutable tag re-points on every deploy, so there is never
            # a previous tag to retain and the rollback target is always gone.
            # Matches Frontend/.github/workflows/ci.yml.
            type=raw,value=${{ github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.nexus-web3.com' }}
            NEXT_PUBLIC_IPFS_GATEWAY=${{ vars.NEXT_PUBLIC_IPFS_GATEWAY || 'https://ipfs-gateway.nexus-web3.com/ipfs/' }}

      # The deploy is a script on the host, not an inline `script:` block, so it
      # can be read, diffed and run by hand during an incident. Ship the current
      # copy every run rather than trusting whatever an earlier deploy left there.
      - name: Copy deploy script to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy-zero-downtime.sh
          target: /var/www/nexus-admin
          overwrite: true

      # Blue-green: boot the new image on the idle port (3020⇄3030), health-check
      # it, flip the nginx upstream, and only then retire the old container. The
      # previous version of this step ran `docker compose stop && rm -f && up -d`,
      # which is a hard outage for the whole boot of the new image.
      - name: Deploy to Web3 Infrastructure
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 300s
          command_timeout: 240s
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            chmod +x /var/www/nexus-admin/deploy-zero-downtime.sh
            bash /var/www/nexus-admin/deploy-zero-downtime.sh \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
