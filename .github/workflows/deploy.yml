name: Deploy Web3 Admin

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Matches the Frontend/Backend convention (ghcr.io/martechnetworks/nexus-*).
  # `github.repository` would have published the admin under the bare repo name
  # and collided with the other two apps in this monorepo.
  IMAGE: ghcr.io/martechnetworks/nexus-admin

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image build runs `pnpm build`, which is `tsc --noEmit && next build`
      # — so type errors already fail this job. A separate checks job would only
      # run the same compiler twice.
      #
      # amd64 only: the VPS is x86, and the arm64 leg doubled build time for an
      # image nothing pulls. Matches Frontend/.github/workflows/ci.yml.
      #
      # Attempt 1 of 2. The image builds fine; what fails intermittently is the
      # upload -- ghcr answers the blob HEAD during layer push with a bare
      # 403 Forbidden, minutes after the same layers pushed cleanly with the same
      # token. It is registry-side, so the only real fix is to try again.
      # continue-on-error keeps a failed attempt from ending the job; the retry
      # below re-raises it for real.
      - name: Build and push Docker image
        id: push_attempt_1
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Explicit, because `docker build` with no target builds the LAST stage
          # in the Dockerfile. Omitting this ships the `development` stage -- a
          # `next dev` server -- to production. Matches Frontend/.github/workflows/ci.yml.
          target: runner
          # The deploy pulls the sha tag, and it is a full, IMMUTABLE sha rather
          # than a mutable environment tag: the keep-N image reclaim on the host
          # retains the previous tag as a rollback target, and a mutable tag
          # re-points on every deploy, so there would never be a previous tag to
          # retain.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          # mode=min, not max. max exports EVERY intermediate layer of every
          # stage to the GHA cache -- hundreds of MB uploaded at the end of each
          # run, serialised after the build and regularly the slowest step in
          # the job. min exports only the final stage's layers. timeout caps the
          # export so a slow cache backend cannot hold the job open; a timed-out
          # export is a warning, not a failure.
          cache-to: type=gha,mode=min,timeout=5m
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Skip the attestation manifests. Nothing on the host consumes them and
          # they add a second manifest push per tag.
          provenance: false
          sbom: false
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.nexus-web3.com' }}
            NEXT_PUBLIC_IPFS_GATEWAY=${{ vars.NEXT_PUBLIC_IPFS_GATEWAY || 'https://ipfs-gateway.nexus-web3.com/ipfs/' }}

      # Attempt 2 of 2. Runs only when the first push failed. The builder still
      # holds every layer from attempt 1, so this re-push costs seconds rather
      # than a rebuild. No continue-on-error: if this one fails the job fails,
      # which is what should happen when ghcr is genuinely broken, not flaky.
      #
      # The inputs are duplicated verbatim rather than shared via a YAML anchor:
      # GitHub Actions does not resolve anchors/aliases in workflow files. Keep
      # the two blocks in sync by hand.
      - name: Build and push Docker image (retry)
        if: steps.push_attempt_1.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: runner
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min,timeout=5m
          github-token: ${{ secrets.GITHUB_TOKEN }}
          provenance: false
          sbom: false
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.nexus-web3.com' }}
            NEXT_PUBLIC_IPFS_GATEWAY=${{ vars.NEXT_PUBLIC_IPFS_GATEWAY || 'https://ipfs-gateway.nexus-web3.com/ipfs/' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    # Queue deploys, never cancel them. A cancel lands mid-script, after nginx is
    # repointed but before the old container is retired, or worse. Note this
    # group is per-repository -- the flock in deploy-zero-downtime.sh is what
    # serialises this against the frontend and backend pipelines, which deploy to
    # the same box and share its disk.
    concurrency:
      group: deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # The deploy is a script on the host, not an inline `script:` block, so it
      # can be read, diffed and run by hand during an incident. Ship the current
      # copy every run rather than trusting whatever an earlier deploy left there.
      - name: Copy deploy script to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy-zero-downtime.sh
          target: /var/www/nexus-admin
          overwrite: true

      # Blue-green: boot the new image on the idle port (3020⇄3030), health-check
      # it, flip the nginx upstream, and only then retire the old container.
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 300s
          # The script waits up to 900s for the host deploy lock (backend,
          # frontend and admin all take it) and then on the health probe, so the
          # old 240s ceiling could kill it mid-swap -- after the new container is
          # up but before nginx is repointed.
          command_timeout: 20m
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            chmod +x /var/www/nexus-admin/deploy-zero-downtime.sh
            bash /var/www/nexus-admin/deploy-zero-downtime.sh \
              ${{ env.IMAGE }}:${{ github.sha }}
